<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lucerito · Belleza{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'inventario/css/styles.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-lucerito sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'producto_list' %}">🌸 Lucerito</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="{% url 'producto_list' %}">Inventario</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'producto_create' %}">Nuevo producto</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'reportes' %}">Reportes</a></li>
        <li class="nav-item"><a class="nav-link btn-chat" href="{% url 'chat' %}">Asistente IA</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>

<footer class="footer-lucerito text-center py-3 mt-4">
  <small>Lucerito · Tienda de belleza · Inventario y ventas</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
